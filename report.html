<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Setup Planner</title>
  <link rel="icon" href="icons/icon32.png">
  <style>
    :root {
      --bg: #f5f6f8; --panel: #ffffff; --text: #1d2330; --muted: #5d6676; --line: #e2e5ea; --soft: #f0f2f5;
      --accent: #1f5fbf; --accent-text: #ffffff;
      --change: #a14a05; --change-bg: #fff3e3; --empty: #0f6e66; --empty-bg: #e5f5f2;
      --check: #9f1239; --check-bg: #fdebef; --same: #4b5563; --same-bg: #eff1f3;
      --new: #6d28d9; --new-bg: #f1eafe; --info: #1d4ed8; --info-bg: #e8effd;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #13161b; --panel: #1b1f26; --text: #e7e9ee; --muted: #9aa3b2; --line: #2b313b; --soft: #232831;
        --accent: #6f9cff; --accent-text: #0d1424;
        --change: #f5b25a; --change-bg: #33271a; --empty: #5fd3c4; --empty-bg: #14302c;
        --check: #f59ab0; --check-bg: #36202a; --same: #b6bcc6; --same-bg: #262a31;
        --new: #c4a7ff; --new-bg: #2a2140; --info: #9dbbff; --info-bg: #1e2a44;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
    button, input, select { font: inherit; color: inherit; }
    header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 24px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand img { width: 24px; height: 24px; }
    h1 { font-size: 17px; margin: 0; }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
    .controls label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
    input[type=date], select, input[type=search], input[type=number], input[type=text] {
      padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel);
    }
    button { padding: 6px 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
    button:hover:not(:disabled) { border-color: var(--muted); }
    button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
    button:disabled { opacity: .45; cursor: default; }
    button.linkish { border: 0; padding: 0; background: none; color: var(--accent); text-decoration: underline; }
    .group { display: inline-flex; }
    .group button { border-radius: 0; margin-left: -1px; }
    .group button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
    .group button:last-child { border-radius: 0 6px 6px 0; }
    main { padding: 18px 24px 48px; max-width: 1380px; margin: 0 auto; }
    #status { padding: 12px 14px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); margin-bottom: 14px; }
    #status.error { border-color: var(--check); color: var(--check); }
    #status.busy::before { content: ""; display: inline-block; width: 12px; height: 12px; margin-right: 8px; vertical-align: -1px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #status:empty, #hint:empty { display: none; }
    #hint { padding: 10px 14px; border-radius: 8px; background: var(--info-bg); color: var(--info); margin-bottom: 14px; }
    #hint button { margin-left: 8px; }
    nav#tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    nav#tabs:empty { display: none; }
    nav#tabs button { padding: 8px 14px; border-radius: 8px; }
    nav#tabs button[aria-selected=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
    nav#tabs small { opacity: .8; margin-left: 6px; }
    .summary { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
    .chip { padding: 8px 12px; border-radius: 8px; background: var(--panel); }
    .chip b { font-size: 18px; margin-right: 6px; }
    .progress { display: flex; align-items: center; gap: 10px; margin-left: auto; color: var(--muted); }
    .progress .bar { width: 140px; height: 8px; border-radius: 99px; background: var(--soft); overflow: hidden; }
    .progress .bar span { display: block; height: 100%; background: var(--empty); }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
    .filters .pill { padding: 5px 11px; border-radius: 999px; font-size: 13px; }
    .filters .pill[aria-pressed=true] { background: var(--text); color: var(--panel); border-color: var(--text); }
    .filters input[type=search] { min-width: 200px; margin-left: auto; }
    .filters label { color: var(--muted); display: flex; gap: 6px; align-items: center; font-size: 13px; }
    section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 16px; overflow: hidden; }
    section h2 { font-size: 15px; margin: 0; padding: 12px 16px; border-bottom: 1px solid var(--line); }
    section h2 small { color: var(--muted); font-weight: normal; margin-left: 6px; }
    section.changes { border-color: var(--new); }
    section.changes h2 { background: var(--new-bg); color: var(--new); }
    section.changes ul { margin: 0; padding: 10px 16px 12px 34px; }
    section.changes li { margin: 3px 0; }
    .scroll { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); font-weight: 600; white-space: nowrap; }
    tr:last-child td { border-bottom: 0; }
    td.ck, th.ck { width: 34px; padding-right: 0; }
    td.ck input { width: 18px; height: 18px; cursor: pointer; margin-top: 2px; }
    tr.done td:not(.ck) { opacity: .45; }
    tr.done .tag { text-decoration: line-through; }
    td.room { font-weight: 600; white-space: nowrap; }
    td small, td.room small { display: block; color: var(--muted); font-weight: normal; }
    td.num { white-space: nowrap; }
    td:last-child { min-width: 190px; }
    .ev { font-weight: 500; }
    .line { margin-top: 4px; }
    .instr { margin-top: 4px; padding: 4px 8px; border-left: 3px solid var(--line); color: var(--muted); font-size: 13px; }
    .moves { margin-top: 5px; color: var(--muted); font-size: 13px; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-weight: 600; }
    .change .tag { background: var(--change-bg); color: var(--change); }
    .empty .tag { background: var(--empty-bg); color: var(--empty); }
    .check .tag { background: var(--check-bg); color: var(--check); }
    .same .tag, .none .tag { background: var(--same-bg); color: var(--same); }
    .badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
    .badge { display: inline-block; padding: 1px 7px; border-radius: 99px; font-size: 12px; font-weight: 600; text-decoration: none; }
    .badge.hold { background: var(--check-bg); color: var(--check); }
    .badge.new { background: var(--new-bg); color: var(--new); }
    .badge.info { background: var(--info-bg); color: var(--info); }
    .badge.link { background: var(--soft); color: var(--accent); }
    .badge.plain { background: var(--soft); color: var(--muted); }
    ul.notes { margin: 5px 0 0; padding-left: 18px; color: var(--muted); font-size: 13px; }
    .foot-note { margin: 0; padding: 10px 16px 12px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); }
    .muted { color: var(--muted); }
    .hidden { display: none !important; }
    footer { color: var(--muted); font-size: 12px; }
    dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); padding: 0; width: min(720px, calc(100vw - 32px)); }
    dialog::backdrop { background: rgba(0, 0, 0, .35); }
    dialog h2 { margin: 0; padding: 14px 18px; border-bottom: 1px solid var(--line); font-size: 16px; }
    dialog .body { padding: 14px 18px; max-height: 65vh; overflow: auto; }
    dialog .body p { margin: 0 0 10px; color: var(--muted); }
    dialog table input[type=text] { width: 100%; }
    dialog table input[type=number] { width: 80px; }
    dialog td, dialog th { padding: 6px; border: 0; }
    dialog .actions { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 18px; border-top: 1px solid var(--line); }
    dialog .actions .left { margin-right: auto; }
    dialog .opt { display: flex; gap: 8px; align-items: center; margin: 12px 0 0; }
    @media (max-width: 700px) {
      header, main { padding-left: 16px; padding-right: 16px; }
      .controls { margin-left: 0; }
      .progress { margin-left: 0; }
      .filters input[type=search] { margin-left: 0; width: 100%; }
    }
    @media print {
      header .controls, #status, #hint, nav#tabs, .filters, .foot-note button, .summary .chip { display: none !important; }
      header { position: static; }
      body { background: #fff; color: #000; }
      section { break-inside: avoid; border-color: #bbb; }
      .badge.link::after { content: " " attr(href); font-weight: normal; }
      tr.done td:not(.ck) { opacity: .6; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand"><img src="icons/icon32.png" alt=""><h1 id="title">Room setup plan</h1></div>
    <div class="controls">
      <label>From <input type="date" id="base"></label>
      <select id="span" aria-label="How far ahead">
        <option value="1">Plan tomorrow</option>
        <option value="2">Plan next 2 days</option>
        <option value="3">Plan next 3 days</option>
      </select>
      <button id="run" class="primary">Refresh from Mazevo</button>
      <span class="group">
        <button id="copy" disabled title="Copy every planned day as a table for Excel or Sheets">Copy</button>
        <button id="csv" disabled title="Download every planned day as a CSV file">CSV</button>
        <button id="print" disabled title="Print the day you are looking at">Print</button>
      </span>
      <button id="settingsBtn" title="Settings" aria-label="Settings">&#9881;</button>
    </div>
  </header>
  <main>
    <div id="hint"></div>
    <div id="status"></div>
    <nav id="tabs" role="tablist"></nav>
    <div id="changes"></div>
    <div id="summary"></div>
    <div id="filters" class="filters"></div>
    <div id="out"></div>
    <footer id="foot"></footer>
  </main>

  <dialog id="settings">
    <form method="dialog">
      <h2>Settings</h2>
      <div class="body">
        <p><b>Furniture rules.</b> How much furniture each layout uses, per person in the count (per table for tabling). Words are matched against the layout name. Change these to match how your crew sets rooms.</p>
        <table>
          <thead><tr><th>Layout words</th><th>Chairs</th><th>6-ft tables</th><th>Rounds</th><th></th></tr></thead>
          <tbody id="rules"></tbody>
        </table>
        <button type="button" id="addRule">Add a layout</button>
        <label class="opt"><input type="checkbox" id="hideOutdoor"> Hide outdoor spaces (buildings named "Outside")</label>
      </div>
      <div class="actions">
        <button type="button" id="resetRules" class="left">Reset to defaults</button>
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="save" id="saveSettings" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="planner.js"></script>
  <script src="render.js"></script>
  <script src="report.js"></script>
</body>
</html>
